faqs:
  # === 帳號與權限 ===
  - id: 1
    question: "教師帳號申請後多久可以開始使用？"
    answer: "教師帳號採取申請審核制，審核過程約需 1-3 個工作天。審核通過後，系統將發送開通通知至您的註冊信箱，屆時即可登入使用所有教學功能。"
    role: "teacher"
    category: "帳號與權限"

  - id: 2
    question: "申請教師帳號需要準備哪些資料？"
    answer: "您需要準備：學校或單位配發的電子信箱、至少 6 個字元的英數組合密碼、完整真實姓名，以及任何能夠證明教師身份的文件（如服務證明或課表截圖）。"
    role: "teacher"
    category: "帳號與權限"

  - id: 3
    question: "申請被拒絕怎麼辦？"
    answer: "請確認您填寫的身份資訊是否正確，或聯絡管理員補件。常見拒絕原因包含：身份文件不清晰、信箱格式錯誤，或資料填寫不完整。"
    role: "teacher"
    category: "帳號與權限"

  - id: 4
    question: "忘記密碼怎麼辦？"
    answer: "請點擊登入頁面下方的「忘記密碼」連結，透過您的註冊信箱接收重設連結，即可重新設定新密碼。"
    role: "all"
    category: "帳號與權限"

  - id: 5
    question: "同一個帳號可以同時擁有教師與學生身份嗎？"
    answer: "目前系統不支援同一帳號兼具雙重身份。如需以學生視角查看課程，請另行申請獨立的學生帳號。"
    role: "all"
    category: "帳號與權限"

  # === 課程管理 ===
  - id: 6
    question: "如何讓學生加入我的課程？"
    answer: "請在課程右側工作區點擊「+ 新增課程碼」，系統將產生一組有效期一個月的課程碼。將此碼提供給學生，學生於自己的「課程總覽」點選「+ 加入課程」後輸入該碼即可完成選課。"
    role: "teacher"
    category: "課程管理"

  - id: 7
    question: "課程碼失效了，如何重新產生？"
    answer: "每堂課同一時間僅有一組有效課程碼，舊碼失效後，您可重新點擊「+ 新增課程碼」產生新的一組。建議在舊碼過期後再重新產生，避免多組代碼同時流通造成混淆。"
    role: "teacher"
    category: "課程管理"

  - id: 8
    question: "刪除課程後還可以復原嗎？"
    answer: "可以。刪除的課程會移至資源回收桶，並在 30 天後才會永久刪除。在此期限內，您可在左側導航欄的「已刪除的課程」區塊中找到並復原該課程。"
    role: "teacher"
    category: "課程管理"

  - id: 9
    question: "「教材/參考資料」和「公告附件」有什麼區別？"
    answer: "兩者用途不同：教材/參考資料（Knowledge Source）會提供給 AI 進行深度解析，系統會對其內容進行向量化索引，用於生成教材與試卷；公告附件則僅作為下載連結，AI 不會讀取其內容，學生可直接在公告下方下載。"
    role: "teacher"
    category: "課程管理"

  # === AI 生成與內容解析 ===
  - id: 10
    question: "系統支援哪些教材檔案格式？"
    answer: "目前支援 PDF、PPTX、DOCX、TXT 及各類型圖檔（PNG、JPG、WEBP），並支援輸入網頁 URL 自動抓取內文，或手動貼上文字。系統會自動辨識文件中的文字與視覺圖表。"
    role: "teacher"
    category: "AI 生成與內容解析"

  - id: 11
    question: "如何使用 AI 生成教材或試卷？"
    answer: "在課程內容頁面，找到目標章節，點選「教材列表」或「試卷列表」旁的「🪄 AI 生成」按鈕，依序完成：設定生成參數（面板 1）、選擇參考資料（面板 2）、勾選目標知識點（面板 3），最後點擊「開始生成」即可。"
    role: "teacher"
    category: "AI 生成與內容解析"

  - id: 12
    question: "上傳網址後系統沒有成功抓取內容怎麼辦？"
    answer: "部分網站設有防護機制，導致自動抓取失敗。系統偵測到失敗後，會自動開啟「手動輸入」對話框，建議您回到目標網頁，全選（Ctrl+A）並複製（Ctrl+C）頁面內容後，貼入對話框中儲存。"
    role: "teacher"
    category: "AI 生成與內容解析"

  - id: 13
    question: "為什麼某些圖片在教材中模糊，AI 卻能理解？"
    answer: "系統整合了視覺語言模型（VLM），能為教材中的圖表自動產生精確的文字描述。您可以在「選擇參考資料」面板的預覽區看到 AI 對各頁圖片的解析說明，藉此確認 AI 是否正確理解了圖表內容。"
    role: "teacher"
    category: "AI 生成與內容解析"

  - id: 14
    question: "為什麼 AI 生成的內容有時和教材原文不完全一致？"
    answer: "這是正常現象。系統使用 RAG 技術讓 AI 在閱讀您的教材後自行撰寫，而非逐字複製，因此會有改寫與整合。若您需要核對原始依據，請點擊生成段落下方的「依據」按鈕，開啟引用來源側邊面板進行對照。"
    role: "teacher"
    category: "AI 生成與內容解析"

  - id: 15
    question: "生成後覺得品質不佳，可以重新生成嗎？"
    answer: "可以。您可以先使用右側面板的「AI 品質評估」功能選擇「事實檢查」或「教學品質查核」取得系統建議，再點擊「重新生成」，系統將參考評估結果與您原先的參數設定重新產生內容。"
    role: "teacher"
    category: "AI 生成與內容解析"

  - id: 16
    question: "生成教材時，「課前預習」和「課後複習」有什麼不同？"
    answer: "課前預習採用引導式導讀風格，幫助學生在上課前建立核心框架與學習動機；課後複習則以結構化整理為主，鞏固課堂知識並提供重點自我檢測清單。兩者在生成設定（面板 1）中切換。"
    role: "teacher"
    category: "AI 生成與內容解析"

  # === 知識點功能 ===
  - id: 17
    question: "什麼是「知識點」？為什麼需要勾選它？"
    answer: "知識點是系統從教材中萃取的核心學習概念，分三個層級：大概念（Big Idea）、核心概念（Core Concept）與子技巧（Sub-skills）。勾選知識點後，AI Agent 會聚焦於這些概念進行深度檢索，產出的教材也會自動標註關聯的知識點，供後續學情分析使用。"
    role: "teacher"
    category: "知識點功能"

  - id: 18
    question: "知識點提取結果不符合教學需求，如何重新提取？"
    answer: "請點擊知識點面板中的「重新提取」按鈕，系統將重新解析文件並更新知識點與知識地圖。請注意，重新提取會完全覆蓋前一個版本的知識點內容，系統會記錄版本號供您參考。"
    role: "teacher"
    category: "知識點功能"

  - id: 19
    question: "如何查看和操作知識地圖？"
    answer: "在生成設定的知識點面板中，點擊「展開知識地圖」按鈕即可顯示互動式知識地圖。您可以使用滑鼠滾輪縮放，或長按左鍵拖曳平移，透過視覺化的節點關聯確認教材是否涵蓋所有必要的教學重點。"
    role: "teacher"
    category: "知識點功能"

  - id: 20
    question: "生成後想修改段落標註的知識點，可以嗎？"
    answer: "可以。進入編輯模式後，點擊段落上的知識點標籤，即可從下拉選單中重新選取更適合的知識點。可選的來源包含：本次生成勾選的知識點，以及同單元中過去已儲存教材所累積的知識點。"
    role: "teacher"
    category: "知識點功能"

  # === 教材與題庫管理 ===
  - id: 21
    question: "為什麼學生無法看到我已儲存的教材？"
    answer: "請確認教材的「發布設定」。完成儲存後，需在教材編輯介面右側的「發布設定」面板中，將學生可見性設為「已發布」，並確認發布時間區間涵蓋目前時間，學生才能看到該教材。"
    role: "teacher"
    category: "教材與題庫管理"

  - id: 22
    question: "如何將優質題目加入個人題庫以便重複使用？"
    answer: "在試卷預覽介面或編輯介面中，點擊題目卡片右上角的「星星圖示」，確認題目資訊並綁定至少一個知識點後，即可收藏。已收藏的題目星星圖示會變為黃色實心，表示該題已成功加入題庫。"
    role: "teacher"
    category: "教材與題庫管理"

  - id: 23
    question: "個人題庫中的題目可以跨課程使用嗎？"
    answer: "可以。存入個人題庫的題目不限於特定課程或單元，您可在任何課程的試卷編輯介面中，透過右側題庫面板搜尋並匯入，實現教學資源的跨課程共享。"
    role: "teacher"
    category: "教材與題庫管理"

  - id: 24
    question: "封存和刪除題庫題目有什麼區別？"
    answer: "封存的題目不會出現在題庫清單中，但歷史試卷中引用該題的紀錄不受影響，且隨時可切換至封存區復原。若直接從題庫移除，建議優先使用「封存」以保留歷史紀錄完整性。"
    role: "teacher"
    category: "教材與題庫管理"

  # === 試卷編輯與計分 ===
  - id: 25
    question: "如何調整試卷的計分模式？"
    answer: "進入試卷編輯介面後，切換至右側「配分」標籤頁。若標籤旁的綠色指示燈亮起，表示已啟用計分；指示燈熄滅則為不計分模式（目前僅「作業」類型支援不計分）。您可透過「配分」開關切換。"
    role: "teacher"
    category: "試卷編輯與計分"

  - id: 26
    question: "「每題配分」和「依題型配分」有什麼差別？"
    answer: "每題配分是預設模式，可對每道題目單獨設定分值，題目卡片與右側面板的分數欄位同步更新。依題型配分則可批量設定同一題型的分值（如：所有選擇題每題 5 分），適合快速配置大量題目。"
    role: "teacher"
    category: "試卷編輯與計分"

  - id: 27
    question: "配分加總後與滿分設定不一致，系統無法儲存怎麼辦？"
    answer: "在「依題型配分」模式下，若各題型分數加總不等於滿分設定，系統將無法儲存。您可以：(1) 手動修改滿分欄位至目前的加總數值；或 (2) 點擊「自動補齊」，系統會切換至「每題配分」模式，並將差額自動補足至最後一題。"
    role: "teacher"
    category: "試卷編輯與計分"

  - id: 28
    question: "簡答題是如何自動批改的？"
    answer: "簡答題由 AI Agent 依語意關聯性批改，評分分三個等級：語意與參考答案高度符合者得全分；部分符合得 50% 分數；語意明顯不符則不給分。建議在發布前設定清晰的參考答案以提升批改準確度。"
    role: "teacher"
    category: "試卷編輯與計分"

  - id: 29
    question: "填空題批改規則是什麼？"
    answer: "填空題採嚴格字串比對，目前不支援部分給分，學生填寫的答案需與標準答案完全一致（包含大小寫與空格）方可得分。建議在設定標準答案時避免多餘空格。"
    role: "teacher"
    category: "試卷編輯與計分"

  - id: 30
    question: "作業與小考、期中考的預設設定有何不同？"
    answer: "「作業」預設為不計分模式，適合自主練習使用；「小考、期中考、期末考」預設開啟計分模式，並自動顯示進階應試設定（學期成績權重、作答時長限制、答案公布時間）。所有類型仍可手動調整各項設定。"
    role: "teacher"
    category: "試卷編輯與計分"

  - id: 31
    question: "如何在複雜的試卷中快速定位特定題目？"
    answer: "您可點擊右側「配分」面板中的題號，左側編輯區將自動跳轉至對應題目位置，方便快速查閱與修改，無需手動捲動頁面。"
    role: "teacher"
    category: "試卷編輯與計分"

  # === RAG 引用來源與品質校對 ===
  - id: 32
    question: "如何確認 AI 引用的來源是否正確？"
    answer: "在 AI 生成的每一段教材或題目下方，皆會標註引用的文件名稱與對應頁碼（如：A_機器學習.pptx P.7-9）。點擊該標註後，右側面板將顯示 AI 實際讀取的原始文字段落與圖片解析內容，供您逐一核對。"
    role: "teacher"
    category: "RAG 引用來源與品質校對"

  - id: 33
    question: "引用來源面板顯示的文字和實際文件不一致怎麼辦？"
    answer: "這可能屬於「文字提取錯誤」，即系統在解析文件時產生了亂碼或漏字。請在引用來源面板下方的回饋區域，選擇「資料解析異常」並附上說明，協助開發團隊優化 OCR 解析邏輯。"
    role: "teacher"
    category: "RAG 引用來源與品質校對"

  - id: 34
    question: "AI 對圖表的解析說明與事實不符，如何回報？"
    answer: "請在引用來源詳情面板下方的回饋區，透過五星評分並選擇「圖片解析錯誤」類別（資料解析異常），詳細說明 AI 解讀錯誤的內容（如：將上升趨勢圖解讀為下降）。您的回饋將直接用於優化 VLM 圖片解析能力。"
    role: "teacher"
    category: "RAG 引用來源與品質校對"

  # === 學情監控 ===
  - id: 35
    question: "如何查看全班的學習狀況？"
    answer: "從左側課程導航欄點擊「學習儀表板」，即可進入班級概覽頁面。您可依章節切換、分別查看「課前診斷」與「課後追蹤」視圖，並透過知識點掌握度長條圖與右側 AI 智能教學建議，快速掌握全班學習動態。"
    role: "teacher"
    category: "學情監控"

  - id: 36
    question: "如何找出需要特別關注的學生？"
    answer: "學習儀表板下方的「關注學生名單」會自動列出弱項知識點較多的學生。點擊學生姓名旁的「查看分析」，可開啟該生的 AI 深度學習診斷報告，查看各知識點的掌握等級與最近作答紀錄。"
    role: "teacher"
    category: "學情監控"

  - id: 37
    question: "成績總覽在哪裡？可以看到哪些資訊？"
    answer: "從左側課程導航欄點擊「成績總覽」即可進入。頁面以橫列（學生）× 縱欄（試卷）的矩陣格式呈現所有成績，並標示紅色預警（總分低於 60 分）、自動計算加權總成績，以及各試卷的班級平均分。"
    role: "teacher"
    category: "學情監控"

  - id: 38
    question: "如何調整各試卷的學期成績權重？"
    answer: "在「成績總覽」頁面，點擊試卷標題下方的「編輯」圖示，即可修改該試卷的學期成績權重百分比。儲存後立即生效，您可在此頁面調整直至各項加總達到 100%。"
    role: "teacher"
    category: "學情監控"

  - id: 39
    question: "可以查看學生的個別作答內容嗎？"
    answer: "可以。在「成績總覽」頁面點擊任一學生的成績格，系統將開啟詳細視窗，逐題顯示該生的原始答案、正確答案，以及 AI 自動批改的評分與個人化評語。"
    role: "teacher"
    category: "學情監控"

  # === 問題回饋 ===
  - id: 40
    question: "如何向開發團隊反映系統問題或建議？"
    answer: "您可以從課程頁面右上角的選單進入「意見回饋中心」，勾選對應的問題類別（支援多選）並填寫詳細說明後提交。所有回饋將直接傳達給開發團隊作為系統優化的重要依據。"
    role: "all"
    category: "問題回饋"

  - id: 41
    question: "生成品質評分是強制填寫的嗎？"
    answer: "基礎的滿意度星等評分在每次儲存 AI 生成內容時觸發。深度實驗評估為選填，但系統設計為每四次生成任務會強制要求完整填寫一次，以確保研究數據的代表性。"
    role: "teacher"
    category: "問題回饋"

problem_types:
  # === 介面與基本功能 ===
  - id: "ui_display_issue"
    label: "介面佈局或顯示錯誤"
    category: "介面與基本功能"
  - id: "functional_bug"
    label: "功能操作錯誤或無反應"
    category: "介面與基本功能"
  - id: "data_sync_error"
    label: "資料同步或存取異常"
    category: "介面與基本功能"

  # === 系統效能與處理程序 ===
  - id: "agent_processing_issue"
    label: "Agent 任務處理逾時或異常"
    category: "系統效能與處理程序"
