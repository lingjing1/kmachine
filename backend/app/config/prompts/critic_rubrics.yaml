
critic_rubrics:
  # 情境不完整、專有名詞超出學生學習範圍（需基於參考資料的相關段落）
  Understandable:
    description: "可理解性 (Understandable)"
    "1": "缺乏必要情境說明，學生無法理解背景與目的。或使用參考資料中完全未出現的專業術語（4個以上），超出學生學習範圍。"
    "2": "情境說明嚴重不足，僅提供片段訊息。或使用 3 個以上超出參考資料範圍的專業術語，學生需要額外背景知識才能理解。"
    "3": "提供基本情境，但不夠完整。或有 1-2 個術語超出參考資料範圍，學生經過推敲可理解內容。"
    "4": "情境說明充足，學生能理解內容背景和目的。所有術語都在參考資料範圍內，符合學生程度。"
    "5": "提供完整情境和背景說明，學生能清楚理解內容的來龍去脈。術語使用精準且完全符合參考資料與學生程度。"

  # 通順度、行文是否像AI、拼寫錯誤、標點符號錯誤
  Grammatical:
    description: "語法正確性與行文通順度 (Grammatical & Fluency)"
    "1": "存在多個嚴重拼寫錯誤（3個以上），或出現亂碼、無意義中英文嚴重破壞閱讀。或帶有極其強烈的 AI 機器生成感或翻譯腔，句型刻板生硬，閱讀起來極度不通順，完全不像專業教師撰寫。"
    "2": "有一定的 AI 痕跡（例如生硬的過渡詞），或存在 2-3 個明顯的拼寫/錯別字，或含有引起閱讀突兀的多餘字元。標點使用不當影響閱讀流暢度。句子結構基本正確但略顯生硬。"
    "3": "沒有明顯的 AI 生成感，但行文風格平淡。有 1 個輕微的拼寫錯誤或標點瑕疵，但不影響整體理解。句子結構通順，文筆尚可。無亂碼或明顯無意義字眼。"
    "4": "無明顯拼寫或標點錯誤，句子結構流暢自然，行文具有溫度，像是由專業教師親自撰寫。無多餘或奇怪的字元。語法與格式符合學術標準。"
    "5": "語法與格式卓越，文筆極度流暢且完全正確。標點使用精準，專業術語拼寫完全正確，句子結構優美易讀，能展現出優秀教育者的專業感。"

  # 邏輯矛盾、生成結果與參考資料不一致
  Logical_Consistency:
    description: "邏輯一致性 (Logical Consistency)"
    "1": "生成結果與參考資料嚴重矛盾，內容明確錯誤。或敘述邏輯混亂，前後互相矛盾。"
    "2": "生成結果與參考資料部分矛盾，或敘述邏輯有明顯漏洞。內容設計不當，可能引發多種解讀或缺乏明確根據。"
    "3": "生成結果與參考資料基本一致，但存在輕微的邏輯瑕疵或不夠精確的表述。內容結構尚可。"
    "4": "生成結果與參考資料完全一致，邏輯清晰正確。內容設計合理，重點層次分明。"
    "5": "生成結果與參考資料完美對應，邏輯嚴謹無誤。內容設計優秀，每段論述皆有明確的邏輯依據。"

  # 簡體字、大陸慣用語、過度口語化
  Phrasing:
    description: "措辭正當性 (Phrasing)"
    "1": "出現任何未轉化為繁體的「簡體中文字」（一票否決，立刻給1分）。或含有多個嚴重的大陸慣用語（如『數據』、『質量』、『智能』等字眼）。或用詞極度不符合專業教育規範（如過度口語化『想一想』、『真的嗎』等不適當的對話語氣）。"
    "2": "沒有簡體字，但含有少量大陸慣用語，或出現少許不專業的口語表達。或連接詞使用重複性高，用詞顯得匱乏。"
    "3": "沒有簡體字，用詞尚可，無明顯口語化或無意義字眼，但可能有 1-2 處繁體化的大陸慣用語未正確轉換為台式用語。遣詞造句缺乏變化，專業度一般。"
    "4": "完全沒有簡體字或大陸慣用語，用詞清晰恰當，具有教育專業度，完全符合台灣學術用語習慣，無不當口語表達。"
    "5": "用詞精準優美，完美契合嚴謹的學術與教育規範，具備極高的教育行文水準。無任何不當字眼、簡體字或慣用語瑕疵。"

  Core_Concept_Focus:
    description: "核心概念聚焦性 (Core Concept Focus)"
    "1": "完全偏離教師選擇的「目標知識點 (Knowledge Points)」，都在討論次要或無關的細節。分析中必須明確指出內容偏離了哪些知識點。"
    "2": "有提到目標知識點，但花費過多篇幅在無關的參考資料細節上，未能妥善聚焦於該知識點的核心概念。"
    "3": "基本呈現了目標知識點，但可能稍有失焦，部分內容與該知識點關聯性不大。"
    "4": "清楚且準確地圍繞目標知識點進行論述，能區分主次，與學習目標緊密結合。"
    "5": "完美聚焦於目標知識點，所有內容都為闡述該知識點服務，與教學目標高度對齊，沒有任何多餘或偏題的篇幅。"

  # 綜合評量：是否遵循教師指示、整體品質
  Would_You_Use_It:
    description: "採用意願 (Would You Use It)"
    "1": "完全不會。完全無視「教師自訂指令」（例如：要求提供範例卻只給定義，或要求引導思考卻死板列出參考資料）。分析必須明確指出「哪一部分完全沒達到教師意圖」，並給出具體的重寫建議。"
    "2": "不會。對教師指令的執行流於表面，或僅死板地貼上參考資料，失去真正的教學引導意義。分析中必須自我反省哪裡未滿足要求並說明如何修改。"
    "3": "會。基本遵循教師指令，但在引導思考或應用範例等深層次意圖上尚有不足。分析必須點出「還少做什麼，可以怎麼優化才能更貼近原意」。"
    "4": "會。確實遵循教師指令與意圖，只需要進行微小的內容潤飾即可完美達到教學目標。分析中需具體說明如何進一步提升效果。"
    "5": "絕對會。完美執行教師的所有意圖，無論是利用參考資料、提供範例或引導思考，皆處理得完美無缺，深度與引導性兼具，無需任何修改即可直接採用。"
