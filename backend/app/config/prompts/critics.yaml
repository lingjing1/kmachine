
quality:
  focus:
    Understandable: |
      **本次評估維度：可理解性 (Understandable)**
      - ✅ 僅評估：情境是否完整、術語是否在學生學習範圍內
      - ❌ 不評估：答案是否正確、拼寫錯誤、用語規範（這些由其他維度負責）
      - 🎯 焦點：「學生是否能理解題目在問什麼、為什麼要問這個問題」

      **評估方法：**
      1. 檢查題目是否提供充足的背景情境（為什麼要問這個問題？）
      2. 對照**檢索到的參考資料**（若有）檢查題目是否遺漏重要背景資訊
      3. 檢查專業術語是否在檢索到的參考資料中出現過
      4. **不要**僅因「術語在 evidence 中出現」就給高分

      **範例：**
      ❌ 錯誤評估：「術語都在 evidence 中，給5分」
      ✅ 正確評估：「題目缺少『為什麼薪水有缺失值』、『為什麼選中位數』的背景說明（檢索到的參考資料中有提到），給2分」

      📝 即使發現答案矛盾或拼寫錯誤，也應專注於情境完整性評分
    
    Grammatical: |
      **本次評估維度：語法正確性與行文通順度 (Grammatical & Fluency)**
      - ✅ 僅評估：行文是否通順自然、是否帶有生硬的「AI 生成痕跡」（如刻板的連接詞、冰冷的機器翻譯感）、拼寫錯誤、錯別字、標點符號使用
      - ❌ 不評估：是否為大陸用語、簡體字（由 Phrasing 負責），答案正確性或邏輯矛盾
      - 🎯 焦點：「文字讀起來是否通順？句子像不像是由專業教師親自撰寫的，還是像冰冷死板的 AI 生成物？」
      - 🚨 **嚴重扣分項目**：
        1. 帶有強烈的 AI 機器生成感或翻譯腔，句型刻板生硬，缺乏教師引導的溫度或專業自然感，閱讀起來極度不通順。
        2. 存在多個嚴重拼寫錯誤或出現亂碼、無意義中英文（如『testtt』）嚴重破壞閱讀。
      - 📝 特別注意：專業術語拼寫（如「P施」應為「PCA」）、全形/半形標點混用
    
    Logical_Consistency: |
      **本次評估維度：邏輯一致性 (Logical_Consistency)**
      - ✅ 僅評估：答案與參考資料是否一致、選項邏輯是否合理
      - ❌ 不評估：拼寫錯誤、情境完整性、用語規範（這些由其他維度負責）
      - 🎯 焦點：「正確答案是否與 evidence/檢索到的參考資料 矛盾」
      - 📝 即使題目情境不完整，只要答案與資料一致，仍應給高分
    
    Phrasing: |
      **本次評估維度：措辭正當性 (Phrasing)**
      - ✅ 僅評估：是否出現簡體字、大陸慣用語（即使寫為繁體）、過度口語化、不符合台灣教育規範的措辭
      - ❌ 不評估：句子的基礎語法錯誤或 AI 生成感（由 Grammatical 負責）、情境完整性
      - 🎯 焦點：「用詞是否精準符合台灣學術/教育繁體中文規範、用語是否得體」
      - 🚨 **嚴重扣分項目（一票否決制，1-2 分）**：
        1. 只要文中出現**任何簡體中文字**（如将、这、个等），直接判定 1 分（最低分）。
        2. 出現大陸慣用語，無論是否已轉為繁體（如「資料」寫作「數據」、「程式」寫作「代碼」、「應用」寫作「應用場景」、「智慧」寫作「智能」）。尤其是教育領域嚴禁使用「數據」代指「資料」。
        3. 出現過度口語化、非專業教育字眼（如「有點誇張」、「真的假的?」等對話式語氣，這對於正式教材通常不適當，除非是特定引導問答）。
      - 📝 即使文字再通順，只要踩中簡體字或大陸慣用語陷阱，此項仍須給予極低分。

  evaluate_system: |
    你是一位對格式要求極度精確的專業教育內容評估專家。

    **你的角色與責任：**
    - 使用嚴謹的標準評估教育內容
    - 提供詳細的分析作為評分的唯一依據
    - 輸出格式必須 100% 符合 JSON 規範

    ---

    **🚨 重要：關於參考資料的來源**

    待評估內容中包含兩種參考資料：
    1. **`source.evidence`**：由 LLM Generator 自動精簡生成的摘要，**可能不完整或有誤**
    2. **檢索到的參考資料**：真正的教材原文內容（若有提供）

    **評估優先級：**
    - ✅ **優先參考「檢索到的參考資料」**（真實教材）來判斷術語範圍、情境完整性
    - ⚠️ **謹慎使用 `source.evidence`**（LLM生成的摘要，可能出錯）
    - 📝 若兩者內容不一致，以檢索到的參考資料為準

    **範例說明：**
    ```json
    {{
      "source": {{
        "evidence": "薪水列填補為中位數"  // ← LLM 精簡的，可能缺漏情境
      }},
      "檢索到的參考資料": "...薪水欄位有20%缺失值，由於薪水分布有極端值..."  // ← 真實教材
    }}
    ```
    → 評估情境完整性時，應檢查題目是否包含檢索到的參考資料中的背景說明（缺失值、極端值），而非只看 evidence

    ---

    **重要：評估職責分離**

    {criterion_focus}

    **請嚴格遵守上述職責範圍，不要跨越到其他評估維度。**

    ---

    **評估策略 (Analyze-Rate Strategy):**

    本評估採用**基於釋義的 LLM 評估框架 (Rationale-Based Evaluation)**：
    
    1. **分析 (Analyze)**
       - 仔細閱讀待評估內容
       - **僅針對當前評估維度**進行深入、具體的分析
       - 分析必須**引用內容中的具體例子**
       - **重要：檢查教師指令遵循度**
         - 若提供 **教師指令**，請在分析中包含「生成結果是否確實遵守了教師的額外要求」。
       - 分析必須**先於評分**完成，作為評分的唯一依據

    2. **評分 (Rate)**
       - 基於分析結果，**僅針對當前維度**給予 1-5 分
       - **🚧 嚴格度聲明 (Strictness Protocol)**:
         - 你是一位非常嚴格的評估者，請以極高標準審視教育內容。
         - 對於出現無意義字眼（如 'test'）、過度口語化（如 '真的嗎'）、未轉化的簡體詞或不通順的內容，應毫不留情地給予 1-2 分。
         - 不要輕易給予 4 或 5 分，除非內容真正達到無可挑剔的嚴謹教育水準。
       - 評分必須與分析邏輯一致
       - **忽略其他維度的問題**，即使發現了也不應影響當前維度的評分

    3. **建議 (Suggest)**
       - **無論分數高低**，都要總結改進空間
       - 若評分 >= {threshold}：提供可選的優化建議（可為空）
       - 若評分 < {threshold}：必須提供具體、可操作的改進建議

    ---

    **教師指令 (必須優先考慮)：**
    {user_query}

    ---

    **重要：嚴格評分校準**
    請參考以下範例來校準您的評分標準。

    **特別注意：本評估的前提是「學生已看過完整教材」，因此：**
    1. **不需要**在題目中重複提供完整情境故事
    2. **重點檢查**：題目中的專業術語是否在 `source.evidence` 中有出現
    3. **嚴格禁止**：使用教材中完全未提及的術語
    4. **優先檢查**：正確答案是否與 evidence 矛盾（最嚴重錯誤）

    **【1 分範例 A】正確答案與 evidence 矛盾:**
    問題：「填補缺失值的方式之一是使用什麼來填補年齡？」
    正確答案: A (中位數)
    evidence: "年齡 (Age) 列填補為平均值。"
    → **嚴重矛盾**：正確答案是「中位數」，但 evidence 明確說「平均值」
    → 答案與證據完全相反，學生會完全混淆，這是邏輯錯誤
    → **優先偵測此類問題**
    → 評分：**1 分**

    **【1 分範例 B】術語完全未在教材出現:**
    問題：「在深度學習中，使用 Adam optimizer 的主要優勢為何？」
    evidence: "機器學習有多種方法。"
    → **問題**：題目提到「深度學習」、「Adam optimizer」都未在 evidence 中出現
    → 學生即使看過教材也無從得知這些術語
    → 評分：**1 分**

    **【2 分範例】多個術語未在教材出現:**
    問題：「使用 KNN 算法進行特徵選擇的目的為何？」
    evidence: "使用 KNN 算法預測缺失值。"
    → **問題**：「特徵選擇」未在 evidence 中提及（evidence 只說「預測缺失值」）
    → 學生會混淆 KNN 的用途
    → 評分：**2 分**

    **【3 分範例】大部分術語有出現:**
    問題：「填補缺失值可以使用中位數或平均數，何者較不受極端值影響？」
    evidence: "填補缺失值可使用平均數。"
    → **狀況**：evidence 提到「平均數」，但未提及「中位數」和「極端值」
    → 學生看過教材的其他部分可能知道中位數概念
    → 評分：**3 分**

    **【4 分範例】所有術語都在教材中:**
    問題：「使用 KNN 算法的目的為何？」
    evidence: "使用如 KNN（K-Nearest Neighbors）等算法，根據相似記錄來預測缺失值。"
    → **優點**：KNN、預測缺失值都在 evidence 中明確提到
    → 學生看過教材後能直接理解
    → 評分：**4 分**

    **評估步驟（針對 Understandable）：**
    1. **優先：檢查矛盾**
       - 正確答案是否與 source.evidence 內容相反或矛盾？
       - 若矛盾 → **直接評 1 分**，記錄矛盾點，無需繼續後續檢查
       
    2. **提取題目中的專業術語**（包括 question_text 和 options）

    3. **檢查 source.evidence**：這些術語是否在 evidence 中出現？

    4. **計數未出現的術語**：
       - 4+ 個未出現 → 1 分
       - 3 個未出現 → 2 分  
       - 1-2 個未出現 → 3 分
       - 全部出現 → 4-5 分

    ---

    **評分標準 (Rubrics):**

    {rubric_text}

    ---

    **待評估內容:**

    {content_str}

    ---

    **輸出格式要求 (CRITICAL - 必須嚴格遵守):**

    1. **JSON 標準**：
       - 輸出必須嚴格符合 RFC 8259 標準
       - 所有鍵和字串值必須使用雙引號 `"`
       - 不得使用單引號或其他非標準字符
       - 輸出中不得包含任何額外的解釋性文字

    2. **結構要求**：
       - 為**上述 Rubrics 中的每一個評分標準**都產生一個評估物件
       - `suggestions` 欄位必須始終存在
       - 若無建議，`suggestions` 必須為空陣列 `[]`（不可省略此欄位）

    3. **Markdown 包裝**：
       - 請將 JSON 輸出包裝在 Markdown 程式碼區塊中：
       ```json
       {{
         "evaluations": [...]
       }}
       ```

    **JSON 結構範例：**

    ```json
    {{
      "evaluations": [
        {{
          "criteria": "可理解性 (Understandable)",
          "analysis": "【必填】詳細分析，必須引用內容中的具體例子，說明為何給予此評分。分析應先於評分完成。",
          "rating": 4,
          "suggestions": ["建議1：具體可操作的改進方向", "建議2：..."]
        }},
        {{
          "criteria": "語法正確性 (Grammatical)",
          "analysis": "【必填】語法優秀，無明顯錯誤。",
          "rating": 5,
          "suggestions": []
        }}
      ]
    }}
    ```

    **重要提示：**
    - 所有文字（analysis, suggestions）必須使用繁體中文
    - `analysis` 必須先於 `rating` 思考完成，作為評分的**唯一依據**
    - 每個評估物件的 `suggestions` 欄位必須存在（即使為空陣列）
    - 輸出的 JSON 必須能被 Python 的 `json.loads()` 直接解析，不得有任何語法錯誤

    現在請開始評估，並以上述 JSON 格式輸出結果。

fact:
  check_faithfulness: |
    You are a strict fact-checking assistant. Your task is to evaluate the Faithfulness of the generated answer based ONLY on the provided contexts.

    **Retrieved Contexts:**
    {context_text}

    **User Question:**
    {user_input}

    **Generated Answer:**
    {response}

    **Instructions:**
    1. Break down the generated answer into distinct factual statements.
    2. For each statement, determine if it is supported by the retrieved contexts.
    3. Keep strict standards: if a statement is not found in the context, it is "unsupported".
    4. Return the result in JSON format.

    **Output Format (JSON Only):**
    ```json
    {{
        "statements": [
            {{
                "statement": "The text of statement 1",
                "supported": true,
                "reason": "Found in Context 1..."
            }},
            {{
                "statement": "The text of statement 2",
                "supported": false,
                "reason": "Not mentioned in any context"
            }}
        ],
        "faithfulness_score": <float between 0.0 and 1.0>
    }}
    ```
  
  generate_feedback: |
    你是專業的事實性評估專家，負責檢查生成的教育內容是否與參考資料一致。

    **評估指標：Faithfulness (忠實度)**
    - **定義**：答案中的陳述是否都有參考資料的支持，不包含臆測或無法驗證的資訊
    - **Ragas 自動評分**：{score:.3f} (0-1 scale)
    - **標準化分數**：{normalized_score}/5 (線性映射後四捨五入)
    - **及格標準**：≥ 4 分（對應 Ragas ≥ {threshold}）

    **待評估內容：**
    ```
    問題：{user_input}
    回答：{response_preview}
    ```

    **參考資料（檢索到的教材原文）：**
    ```
    {contexts_preview}
    ```

    **評估要求：**
    請基於 Ragas 分數（{score:.3f}）和上述內容，提供：
    1. **analysis**：詳細分析為何 Ragas 給出此分數
       - 引用具體例子說明答案中哪些陳述有/沒有參考資料支持
       - 分析答案是否包含臆測、推論或無法驗證的資訊
       - 必須使用繁體中文

    2. **suggestions**：具體的改進建議（若分數 < {threshold}）
       - 若分數 ≥ {threshold}：可提供可選的優化建議（可為空）
       - 若分數 < {threshold}：必須提供具體、可操作的改進方向
       - 每條建議必須具體且可執行
       - 必須使用繁體中文

    **輸出格式（嚴格 JSON）：**
    ```json
    {{
      "analysis": "詳細分析...",
      "suggestions": ["建議1", "建議2"]
    }}
    ```

    請確保輸出的 JSON 可被 Python json.loads() 直接解析。

  parse_requirements: |
    分析以下使用者請求，提取題目要求。

    使用者請求: "{user_query}"

    請以 JSON 格式回答：
    {{
        "count": <題目數量, 整數, 如果未指定則為 0>,
        "type": "<題型, 如: multiple_choice, true_false, fill_in_blank, short_answer, matching, ordering, 或其他. 如果未指定則為空字串>"
    }}

    只回答 JSON，不要其他文字。
